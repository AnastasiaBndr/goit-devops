replicaCount:2

image:
  repository: "<account_id>.dkr.ecr.us-west-2.amazonaws.com/lesson-7-ecr"
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: false

config:
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: django_user
  POSTGRES_DB: django_db
  POSTGRES_PASSWORD: pass9764gd
  ALLOWED_HOSTS: "localhost,127.0.0.1,django,django_app"
  SECRET_KEY: "django-insecure-your-secret-key-here"
  DEBUG: "True"
